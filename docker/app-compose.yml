services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: agent-project-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://interview:interview@postgres:5432/interview_assistant
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_PATH: /app/runtime/qdrant
      MINIO_ENDPOINT: http://minio:9000
      MODEL_CONFIG_PATH: /app/runtime/model_config.json
      RAG_COLLECTION_NAME: interview_knowledge_base
      RAG_EMBEDDING_PROVIDER: fastembed
      RAG_EMBEDDING_MODEL: intfloat/multilingual-e5-small
      RAG_USE_QDRANT: "true"
      RAG_ALLOW_HASHING_FALLBACK: "true"
      RAG_ALLOW_MEMORY_FALLBACK: "true"
    volumes:
      - backend_runtime:/app/runtime
    ports:
      - "18000:8000"
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: agent-project-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend_runtime:
